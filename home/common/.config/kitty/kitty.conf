# ==============================================================================
# KITTY CONFIGURATION (Catppuccin Macchiato • Power-User Edition)
# ==============================================================================

# --- Typography & Fonts ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

# --- Window Layout & Aesthetics ---
hide_window_decorations yes
window_padding_width    8
background_opacity      0.95
confirm_os_window_close 0
tab_bar_style           hidden

# --- Wayland Performance & Latency Tuning ---
sync_to_monitor         yes
input_delay             2
repaint_delay           6
enable_audio_bell       no

# --- Mouse & Clipboard Handling ---
copy_on_select          yes
clipboard_control       write-clipboard write-primary read-clipboard-ask
cursor_blink_interval   0

# --- Window & Pane Navigation (Fallback if not using Zellij) ---
map shift+enter launch --location=vsplit
map ctrl+shift+enter launch --location=hsplit
map ctrl+w close_window

# --- Power-User Kitten Shortcuts ---
# 1. URL & File Path Hints (Open with letter tags without touching mouse)
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program default
map ctrl+shift+p>h kitten hints --type hash --program default
map ctrl+shift+p>l kitten hints --type line --program default

# 2. Unicode / Emoji Picker
map ctrl+shift+u kitten unicode_input

# 3. Buffer Scrollback Pager
map ctrl+shift+h show_scrollback

# ==============================================================================
# Theme: Catppuccin Macchiato
# ==============================================================================
foreground              #CAD3F5
background              #24273A
selection_foreground    #24273A
selection_background    #F4DBD6

# Cursor
cursor                  #F4DBD6
cursor_text_color       #24273A
url_color               #F4DBD6

# Kitty window borders
active_border_color     #B7BDF8
inactive_border_color   #6E738D
bell_border_color       #EED49F

# Titlebar
wayland_titlebar_color  system

# Tab bar
active_tab_foreground   #181926
active_tab_background   #C6A0F6
inactive_tab_foreground #CAD3F5
inactive_tab_background #1E2030
tab_bar_background      #181926

