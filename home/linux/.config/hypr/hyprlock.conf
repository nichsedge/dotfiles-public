background {
    monitor =
    path = /home/al/Pictures/Wallpapers/13ol6fbk1in91.png
    blur_passes = 2
    blur_size = 5
    color = rgba(30,30,46,1.0)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(137,180,250,1.0)
    inner_color = rgba(30,30,46,0.8)
    font_color = rgba(205,214,244,1.0)
    placeholder_text = <i>Password</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgba(205,214,244,1.0)
    position = 0, 80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    font_size = 18
    color = rgba(205,214,244,0.9)
    position = 0, 20
    halign = center
    valign = center
}
