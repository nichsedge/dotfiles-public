# ════════════════════════════════════════════════════════════
# Hyprland Configuration — Opinionated macOS Workflow
# ════════════════════════════════════════════════════════════

autogenerated = 0

# ── Monitor Setup ──
monitor=,preferred,auto,1

# ── Autostart Essential Services ──
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet &
exec-once = blueman-applet &

# ── Environment Variables ──
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# ── Input & Trackpad (macOS Feel) ──
input {
    kb_layout = us
    kb_options = caps:escape
    repeat_rate = 35
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 1.0
    }
}

# ── Trackpad Gestures (macOS Spaces Gesture) ──
gesture = 3, horizontal, workspace
gesture = 4, up, workspace, e-1
gesture = 4, down, workspace, e+1

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
}

# ── Look and Feel ──
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(89b4facc) rgba(cba6f7cc) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000045)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.16, 1, 0.3, 1
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 6, default
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 5, smoothOut, slide
    animation = specialWorkspace, 1, 4, smoothOut, slidevert
}

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ── Window Rules for Floating Dialogs & Utilities ──
windowrule = match:class ^(pavucontrol)$, float on, center on, size 800 600
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(org.gnome.Calculator)$, float on, center on
windowrule = match:class ^(blueman-manager)$, float on, center on
windowrule = match:class ^(gnome-system-monitor)$, float on, center on, size 900 650
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on
windowrule = match:title ^(Open File)$, float on, center on
windowrule = match:title ^(Save File)$, float on, center on
windowrule = match:title ^(Volume Control)$, float on, center on

# ════════════════════════════════════════════════════════════
# macOS Keybindings Reference
# ════════════════════════════════════════════════════════════
$mod     = SUPER
$term    = ghostty
$menu    = wofi --show drun --allow-images
$scripts = /home/al/.config/hypr/scripts

# ── Spotlight & App Launchers ──
bind = $mod, SPACE, exec, $menu                                 # ⌘ Space: Spotlight / App launcher
bind = $mod SHIFT, SPACE, exec, $scripts/clipboard.sh          # ⌘ ⇧ Space: Clipboard history
bind = $mod SHIFT, V, exec, $scripts/clipboard.sh              # ⌘ ⇧ V: Clipboard history (alt)
bind = $mod, RETURN, exec, $term                               # ⌘ ↩: Terminal
bind = $mod, T, exec, $term                                    # ⌘ T: Terminal
bind = $mod, N, exec, nautilus --new-window                    # ⌘ N: Finder / Files
bind = $mod, B, exec, xdg-open https://google.com             # ⌘ B: Browser
bind = $mod, COMMA, exec, $term -e nvim ~/.config/hypr/hyprland.conf # ⌘ , : Edit config
bind = $mod, SLASH, exec, $scripts/cheatsheet.sh              # ⌘ / : Shortcut cheatsheet
bind = $mod SHIFT, W, exec, $scripts/wallpaper.sh              # ⌘ ⇧ W: Cycle wallpaper

# ── Window Lifecycle & Control (macOS Muscle Memory) ──
bind = $mod, Q, killactive,                                    # ⌘ Q: Quit focused window
bind = $mod, W, killactive,                                    # ⌘ W: Close focused window
bind = $mod, F, fullscreen, 0                                  # ⌘ F: Fullscreen
bind = $mod CTRL, F, fullscreen, 0                             # ⌃ ⌘ F: macOS Fullscreen
bind = $mod, M, movetoworkspacesilent, special:min            # ⌘ M: Minimize to scratchpad
bind = $mod, H, movetoworkspacesilent, special:min            # ⌘ H: Hide window to scratchpad
bind = $mod SHIFT, M, togglespecialworkspace, min             # ⌘ ⇧ M: Restore/toggle minimized
bind = $mod SHIFT, H, togglespecialworkspace, min             # ⌘ ⇧ H: Restore/toggle minimized
bind = $mod, TAB, cyclenext,                                  # ⌘ Tab: Cycle windows
bind = $mod SHIFT, TAB, cyclenext, prev                        # ⌘ ⇧ Tab: Cycle windows backward
bind = ALT, TAB, cyclenext,                                    # ⌥ Tab: Cycle windows
bind = ALT SHIFT, TAB, cyclenext, prev                         # ⌥ ⇧ Tab: Cycle windows backward
bind = $mod, V, togglefloating,                                # ⌘ V: Toggle float
bind = $mod ALT, C, centerwindow,                              # ⌘ ⌥ C: Center floating window
bind = $mod, P, pseudo,                                        # ⌘ P: Pseudo-tile
bind = $mod, J, layoutmsg, togglesplit                         # ⌘ J: Toggle split direction
bind = $mod ALT, ESCAPE, exec, $term -e btop                   # ⌘ ⌥ ⎋: Activity Monitor / Task Manager

# ── Window Navigation & Snapping (Rectangle / Magnet Style) ──
bind = $mod ALT, LEFT, movefocus, l                            # ⌘ ⌥ ←: Focus left
bind = $mod ALT, RIGHT, movefocus, r                           # ⌘ ⌥ →: Focus right
bind = $mod ALT, UP, movefocus, u                              # ⌘ ⌥ ↑: Focus up
bind = $mod ALT, DOWN, movefocus, d                            # ⌘ ⌥ ↓: Focus down
bind = $mod SHIFT, LEFT, movewindow, l                         # ⌘ ⇧ ←: Move window left
bind = $mod SHIFT, RIGHT, movewindow, r                        # ⌘ ⇧ →: Move window right
bind = $mod SHIFT, UP, movewindow, u                           # ⌘ ⇧ ↑: Move window up
bind = $mod SHIFT, DOWN, movewindow, d                         # ⌘ ⇧ ↓: Move window down

# ── Window Resizing ──
binde = $mod CTRL, LEFT, resizeactive, -30 0                  # ⌘ ⌃ ←: Shrink width
binde = $mod CTRL, RIGHT, resizeactive, 30 0                   # ⌘ ⌃ →: Expand width
binde = $mod CTRL, UP, resizeactive, 0 -30                     # ⌘ ⌃ ↑: Shrink height
binde = $mod CTRL, DOWN, resizeactive, 0 30                    # ⌘ ⌃ ↓: Expand height

# ── Screenshots (macOS Native Shortcuts) ──
bind = $mod SHIFT, 3, exec, $scripts/screenshot.sh full        # ⌘ ⇧ 3: Entire Screen
bind = $mod SHIFT, 4, exec, $scripts/screenshot.sh area        # ⌘ ⇧ 4: Selected Region
bind = $mod SHIFT, 5, exec, $scripts/screenshot.sh window      # ⌘ ⇧ 5: Focused Window

# ── macOS Spaces (Workspaces) & Mission Control ──
bind = $mod, 1, workspace, 1                                  # ⌘ 1: Jump to Space 1
bind = $mod, 2, workspace, 2                                  # ⌘ 2: Jump to Space 2
bind = $mod, 3, workspace, 3                                  # ⌘ 3: Jump to Space 3
bind = $mod, 4, workspace, 4                                  # ⌘ 4: Jump to Space 4
bind = $mod, 5, workspace, 5                                  # ⌘ 5: Jump to Space 5
bind = $mod, 6, workspace, 6                                  # ⌘ 6: Jump to Space 6
bind = $mod, 7, workspace, 7                                  # ⌘ 7: Jump to Space 7
bind = $mod, 8, workspace, 8                                  # ⌘ 8: Jump to Space 8
bind = $mod, 9, workspace, 9                                  # ⌘ 9: Jump to Space 9

bind = $mod CTRL, 1, movetoworkspace, 1                       # ⌘ ⇧ 1: Move to Space 1
bind = $mod CTRL, 2, movetoworkspace, 2                       # ⌘ ⇧ 2: Move to Space 2
bind = $mod CTRL, 3, movetoworkspace, 3                       # ⌘ ⇧ 3: Move to Space 3
bind = $mod CTRL, 4, movetoworkspace, 4                       # ⌘ ⇧ 4: Move to Space 4
bind = $mod CTRL, 5, movetoworkspace, 5                       # ⌘ ⇧ 5: Move to Space 5
bind = $mod CTRL, 6, movetoworkspace, 6                       # ⌘ ⇧ 6: Move to Space 6
bind = $mod CTRL, 7, movetoworkspace, 7                       # ⌘ ⇧ 7: Move to Space 7
bind = $mod CTRL, 8, movetoworkspace, 8                       # ⌘ ⇧ 8: Move to Space 8
bind = $mod CTRL, 9, movetoworkspace, 9                       # ⌘ ⇧ 9: Move to Space 9

# Space navigation with Ctrl arrows (macOS Spaces)
bind = CTRL, LEFT, workspace, e-1                              # ⌃ ←: Previous Space
bind = CTRL, RIGHT, workspace, e+1                             # ⌃ →: Next Space
bind = CTRL, UP, togglespecialworkspace, min                   # ⌃ ↑: Mission Control / Scratchpad
bind = CTRL, DOWN, togglespecialworkspace, min                 # ⌃ ↓: Mission Control / Scratchpad

# ── System & Session Management ──
bind = $mod, L, exec, pidof hyprlock || hyprlock              # ⌘ L: Lock screen
bind = $mod CTRL, Q, exec, pidof hyprlock || hyprlock         # ⌃ ⌘ Q: macOS Lock screen
bind = $mod SHIFT, Q, exec, $scripts/powermenu.sh              # ⌘ ⇧ Q: macOS System / Power menu
bind = $mod SHIFT, R, exec, hyprctl reload && pkill waybar; waybar & notify-send "Hyprland & Waybar Reloaded"

# ── Mouse Window Dragging (⌘ + Left/Right Click) ──
bindm = $mod, mouse:272, movewindow                            # ⌘ + Left Click: Drag Window
bindm = $mod, mouse:273, resizewindow                          # ⌘ + Right Click: Resize Window

# ── Media & Hardware Keys (with on-screen feedback) ──
bindel = , XF86AudioRaiseVolume, exec, $scripts/volume.sh up
bindel = , XF86AudioLowerVolume, exec, $scripts/volume.sh down
bindl  = , XF86AudioMute, exec, $scripts/volume.sh mute
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, $scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, $scripts/brightness.sh down
