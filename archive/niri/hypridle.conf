general {
    lock_cmd = dms ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

# Dim screen to 10% after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock session after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Power off display via DPMS after 6 minutes (no system suspend; agents keep running)
listener {
    timeout = 360
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# atracker idle detection
listener {
    timeout = 300
    on-timeout = touch /run/user/1000/atracker-idle /tmp/atracker-idle
    on-resume = rm -f /run/user/1000/atracker-idle /tmp/atracker-idle /tmp/atracker-idle-flag
}
